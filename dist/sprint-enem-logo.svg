<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sprintGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="35%" stop-color="#9333EA" />
      <stop offset="70%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4A044E" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#sprintGradient)" />
  
  <!-- Central Lightning Bolt with Shadow -->
  <g filter="url(#dropShadow)">
    <path 
      d="M232 92 L332 92 L276 196 L366 196 L194 392 L244 260 L160 260 Z" 
      fill="#FFFFFF" 
    />
  </g>
  
  <!-- SPRINT ENEM Text -->
  <text 
    x="256" 
    y="442" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
    font-size="42" 
    font-weight="900" 
    letter-spacing="2" 
    fill="#FFFFFF"
  >SPRINT ENEM</text>
</svg>
